title: Leafy & Me
tagline: A little care. A lot of growth.
description: A simple plant care companion for iPhone and iPad. Organize your plants, build a care routine, and grow at your own pace.
url: "https://leafyandme.com"
baseurl: ""
lang: en
author: Leafy & Me
support_email: support@leafyandme.com
repository_url: https://github.com/leafyandme/application
issues_url: https://github.com/leafyandme/application/issues/new
# Set the real App Store URL when the app is available. Blank shows Coming soon.
app_store_url: ""
minimum_ios: "18"
catalog_count: 560
markdown: kramdown
permalink: pretty
strict_front_matter: true
defaults:
  - scope:
      path: ""
    values:
      layout: default
include:
  - .nojekyll
exclude:
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - scripts
  - node_modules
  - package.json
  - package-lock.json
