- icon: grid
  title: Your own little jungle.
  text: Give every plant a name, a room, and a photo. Find it again by name, type, or room, whether you have three plants or thirty.
- icon: calendar
  title: A routine that fits your life.
  text: Choose two preferred care days to bring nearby checks together. Adjust intervals and seasonal schedules to suit each plant.
- icon: bell
  title: A gentle nudge, once a day.
  text: One daily summary brings your care tasks together. Unfinished care stays visible, without the same reminder over and over.
- icon: water
  title: More than just watering.
  text: Keep track of feeding, repotting, rotating, and trimming, too. Add custom tasks for the things that make your plants yours.
- icon: history
  title: Less guessing. More knowing.
  text: See what you did and when. Record care, snooze a check, correct a date, or undo an accidental tap. Still moist? Check again later.
- icon: backup
  title: At home on every device.
  text: Keep your plants, photos, and care history in sync with private iCloud. Export an extra backup to iCloud Drive whenever you like, and bring your collection with you.
