<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Leafy &amp; Me home"><img class="brand-illustration" src="{{ '/assets/images/brand-illustration.png' | relative_url }}" width="52" height="52" alt=""><span>leafy &amp; me<span class="brand-dot">.</span></span></a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/' | relative_url }}#features">Features</a>
      <a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Support</a>
      <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy</a>
    </nav>
    <a class="button button-small header-cta" href="{{ site.app_store_url }}">Get app {% include icon.html name='arrow' %}</a>
  </div>
</header>
